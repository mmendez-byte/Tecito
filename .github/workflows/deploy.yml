# Despliegue de Tecito.
#   push a main        → staging   (tecito-staging)
#   tag v*             → production (tecito)
#   workflow_dispatch  → elegir entorno a mano
#
# Secretos del repositorio (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN      token con permisos Workers Scripts:Edit, Workers KV Storage:Edit, D1:Edit, Queues:Edit, Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID
#   ANTHROPIC_API_KEY_STAGING / ANTHROPIC_API_KEY_PRODUCTION
#   TURNSTILE_SECRET_STAGING  / TURNSTILE_SECRET_PRODUCTION
#   SESSION_SIGNING_KEY_STAGING / SESSION_SIGNING_KEY_PRODUCTION
#   SHEETS_ENDPOINT_URL_STAGING / SHEETS_ENDPOINT_URL_PRODUCTION
#   SHEETS_ENDPOINT_TOKEN_STAGING / SHEETS_ENDPOINT_TOKEN_PRODUCTION
# Los secretos del Worker se suben en cada deploy con `wrangler secret bulk`, así una rotación
# es cambiar el valor en GitHub y volver a correr el workflow.

name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno"
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
    environment: ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: D1 migrations ${{ env.TARGET }}
        run: npx wrangler d1 migrations apply DB --env "$TARGET" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy ${{ env.TARGET }}
        run: npx wrangler deploy --env "$TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload secrets ${{ env.TARGET }}
        run: |
          if [ "$TARGET" = "production" ]; then S=PRODUCTION; else S=STAGING; fi
          pick() { eval "printf '%s' \"\${$1_$S}\""; }
          jq -n \
            --arg a "$(pick ANTHROPIC_API_KEY)" \
            --arg t "$(pick TURNSTILE_SECRET)" \
            --arg k "$(pick SESSION_SIGNING_KEY)" \
            --arg u "$(pick SHEETS_ENDPOINT_URL)" \
            --arg s "$(pick SHEETS_ENDPOINT_TOKEN)" \
            '{ANTHROPIC_API_KEY:$a, TURNSTILE_SECRET:$t, SESSION_SIGNING_KEY:$k, SHEETS_ENDPOINT_URL:$u, SHEETS_ENDPOINT_TOKEN:$s}
             | with_entries(select(.value != ""))' > /tmp/secrets.json
          npx wrangler secret bulk /tmp/secrets.json --env "$TARGET"
          rm -f /tmp/secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY_STAGING: ${{ secrets.ANTHROPIC_API_KEY_STAGING }}
          ANTHROPIC_API_KEY_PRODUCTION: ${{ secrets.ANTHROPIC_API_KEY_PRODUCTION }}
          TURNSTILE_SECRET_STAGING: ${{ secrets.TURNSTILE_SECRET_STAGING }}
          TURNSTILE_SECRET_PRODUCTION: ${{ secrets.TURNSTILE_SECRET_PRODUCTION }}
          SESSION_SIGNING_KEY_STAGING: ${{ secrets.SESSION_SIGNING_KEY_STAGING }}
          SESSION_SIGNING_KEY_PRODUCTION: ${{ secrets.SESSION_SIGNING_KEY_PRODUCTION }}
          SHEETS_ENDPOINT_URL_STAGING: ${{ secrets.SHEETS_ENDPOINT_URL_STAGING }}
          SHEETS_ENDPOINT_URL_PRODUCTION: ${{ secrets.SHEETS_ENDPOINT_URL_PRODUCTION }}
          SHEETS_ENDPOINT_TOKEN_STAGING: ${{ secrets.SHEETS_ENDPOINT_TOKEN_STAGING }}
          SHEETS_ENDPOINT_TOKEN_PRODUCTION: ${{ secrets.SHEETS_ENDPOINT_TOKEN_PRODUCTION }}

      - name: Smoke test
        run: |
          if [ "$TARGET" = "production" ]; then URL="https://tecito.digitalcompi.com"; else URL="${{ vars.STAGING_URL || 'https://tecito-staging.digitalcompi.workers.dev' }}"; fi
          curl -fsS "$URL/health" && echo && curl -fsS -o /dev/null -w "widget.js %{http_code}\n" "$URL/widget.js"
